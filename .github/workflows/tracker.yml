name: Flight Tracker (KUL -> DAM)

on:
  schedule:
    # 00:00 UTC = 08:00 Asia/Kuala_Lumpur (daily)
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  track-flights:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Flight Tracker once
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ORIGIN_IATA: ${{ secrets.ORIGIN_IATA }}
          DESTINATION_IATA: ${{ secrets.DESTINATION_IATA }}
          DATE_FROM: ${{ secrets.DATE_FROM }}
          DATE_TO: ${{ secrets.DATE_TO }}
          MAX_LAYOVER_HOURS: ${{ secrets.MAX_LAYOVER_HOURS }}
          MIN_BAGGAGE_KG: ${{ secrets.MIN_BAGGAGE_KG }}
          TARGET_PRICE_MYR: ${{ secrets.TARGET_PRICE_MYR }}
          BAGGAGE_UNKNOWN_POLICY: ${{ secrets.BAGGAGE_UNKNOWN_POLICY }}
          TZ_NAME: ${{ secrets.TZ_NAME }}
          FALLBACK_MYR_TO_USD: ${{ secrets.FALLBACK_MYR_TO_USD }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          SERPAPI_DATES_PER_RUN: ${{ secrets.SERPAPI_DATES_PER_RUN }}
          SERPAPI_MONTHLY_BUDGET: ${{ secrets.SERPAPI_MONTHLY_BUDGET }}
          AMADEUS_CLIENT_ID: ${{ secrets.AMADEUS_CLIENT_ID }}
          AMADEUS_CLIENT_SECRET: ${{ secrets.AMADEUS_CLIENT_SECRET }}
          AMADEUS_ENV: ${{ secrets.AMADEUS_ENV }}
          KIWI_API_KEY: ${{ secrets.KIWI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: npm run run:once

