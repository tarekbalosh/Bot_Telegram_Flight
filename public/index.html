<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flight Tracker Agent (KUL → DAM)</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b1120;
      color: #e2e8f0;
      padding: 1.5rem;
    }
    .card {
      max-width: 560px;
      width: 100%;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 2rem;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
    }
    .badge {
      display: inline-block;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 9999px;
      padding: 0.25rem 0.75rem;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 1rem;
    }
    h1 {
      margin: 0 0 0.5rem;
      font-size: 1.5rem;
    }
    p {
      color: #94a3b8;
      line-height: 1.6;
      margin: 0.5rem 0 1.25rem;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-top: 1.25rem;
    }
    a.btn {
      text-decoration: none;
      padding: 0.6rem 1rem;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      background: #38bdf8;
      color: #0f172a;
    }
    a.btn.secondary {
      background: #334155;
      color: #f8fafc;
    }
    code {
      background: #0f172a;
      padding: 0.2rem 0.4rem;
      border-radius: 4px;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <main class="card">
    <span class="badge">● Active on Vercel</span>
    <h1>✈️ Flight Tracker Agent (KUL → DAM)</h1>
    <p>
      Autonomous flight price &amp; itinerary tracker running on Vercel Serverless Functions &amp; Vercel Schedules (daily at <code>08:00 Asia/Kuala_Lumpur</code>).
    </p>
    <div class="actions">
      <a class="btn" href="/api/cron?dryRun=true">Test Dry Run</a>
      <a class="btn secondary" href="/api/cron?forceNotify=true">Run Live &amp; Notify Now</a>
      <a class="btn secondary" href="/api/cron">Run Standard Check</a>
    </div>
  </main>
</body>
</html>
